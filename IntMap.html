<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map with Code-Defined Distances</title>
    <style>
        /* 1. Reset page spacing and force full-screen dimensions */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #ffffff;
            position: relative;
        }

        /* 2. Create the intersecting grid lines using CSS backgrounds */
        body {
            background-size: 20px 20px; 
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.15) 1px, transparent 1px);
        }
        
        .hello {
            display: block;        
            margin-left: auto;     
            margin-right: auto;    
            max-width: 100%;       
            height: auto;          
        }

        /* Container to hold map and nodes relative to each other */
        .map-container {
            position: relative;
            display: inline-block;
            margin: 0 auto;
        }

        /* Node buttons styling */
        .node {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid #333;
            background-color: #fff;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 3;
            transition: all 0.2s ease;
        }

        .node.selected {
            background-color: #3498db;
            border-color: #2980b9;
        }

        .node.connected {
            background-color: #2ecc71;
            border-color: #27ae60;
        }

        /* SVG overlay spanning the same space as the container */
        #connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        line {
            stroke: #2ecc71;
            stroke-width: 4;
            stroke-linecap: round;
        }

        /* Distance text styling on top of lines */
        .distance-label {
            fill: #c0392b;
            font-family: sans-serif;
            font-size: 13px;
            font-weight: bold;
            text-anchor: middle;
            paint-order: stroke;
            stroke: #ffffff;
            stroke-width: 3px; /* Creates a clean white border around text for readability */
        }

        /* 3. Info Box Styling */
        .info-box {
            position: absolute;
            width: 250px;
            background: white;
            border: 2px solid #333;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            padding: 12px;
            z-index: 10;
            font-family: sans-serif;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .info-box img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 8px;
            display: none;
        }

        .info-box h2 {
            margin-top: 0;
            margin-bottom: 6px;
            font-size: 1.1rem;
            color: #333;
        }

        .info-box p {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 0;
        }

        .close-btn {
            position: absolute;
            top: 8px;
            right: 10px;
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: #aaa;
            z-index: 11;
        }

        .close-btn:hover {
            color: #333;
        }
    </style>
</head>
<body>

<div class="map-container" id="mapContainer">
    <img src="MarikinaMap.png" style="height:1500px;width:1500px;opacity:0.6" class="hello">
    
    <svg id="connections"></svg>

    <button class="node" data-id="1" data-title="Kapitan Moy" data-info="The historical house of Laurentio 'Kapitan Moy' Guevara, known as the cradle of the Marikina shoe industry." data-image="Kmoy.jpg" style="top: 76%; left: 34.5%;"></button>
    <button class="node" data-id="2" data-title="Our Lady of the Abandoned" data-info="A historic parish church in Marikina housing the venerated image of the Nuestra Señora de los Desamparados." data-image="" style="top: 76%; left: 35%;"></button>
    <button class="node" data-id="3" data-title="Marikina Sports Center" data-info="A premier sports complex featuring an Olympic-size swimming pool, rubberized track oval, and a large grandstand." data-image="" style="top: 71%; left: 42%;"></button>
    <button class="node" data-id="4" data-title="Shoe Museum" data-info="Home to a massive collection of footwear, famously featuring shoes owned by former First Lady Imelda Marcos." data-image="" style="top: 79%; left: 35.5%;"></button>
    <button class="node" data-id="5" data-title="Marikina Cityhood Park" data-info="A scenic public park that commemorates the city's conversion into a highly urbanized city." data-image="" style="top: 69.7%; left: 41%;"></button>
    <button class="node" data-id="6" data-title="Freedom Park" data-info="A popular public space located right across the city hall, often used for community events and gatherings." data-image="" style="top: 73%; left: 40%;"></button>
    <button class="node" data-id="7" data-title="Marikina River Park" data-info="An award-winning park along the Marikina River banks popular for jogging, biking, and outdoor recreation." data-image="" style="top: 72%; left: 31%;"></button>
</div>

<script>
    // --- INPUT YOUR DISTANCES HERE FOR EACH NODE PAIR ---
    // The keys are the 'data-id' numbers of the two nodes joined by a hyphen.
    // Order doesn't matter ("1-2" is the same as "2-1").
    const predefinedDistances = {
"1-2": "0.3 km",
        "1-3": "0.9 km",
        "1-4": "0.8 km",
        "1-5": "1.4 km",
        "1-6": "2.1 km",
        "1-7": "1.7 km",
        "2-3": "1.1 km",
        "2-4": "0.5 km",
        "2-5": "1.6 km",
        "2-6": "2.3 km",
        "2-7": "1.9 km",
        "3-4": "1.3 km",
        "3-5": "1.2 km",
        "3-6": "1.8 km",
        "3-7": "2.2 km",
        "4-5": "1.5 km",
        "4-6": "2.0 km",
        "4-7": "2.4 km",
        "5-6": "0.9 km",
        "5-7": "1.1 km",
        "6-7": "0.7 km"
        // Add more pairs as needed, e.g., "3-6": "1.5 km"
    };

    let firstSelectedButton = null;
    const svg = document.getElementById('connections');
    const container = document.getElementById('mapContainer');

    const openBoxes = {};

    document.querySelectorAll('.node').forEach(button => {
        button.addEventListener('click', (e) => {
            const clickedButton = e.currentTarget;
            const nodeId = clickedButton.getAttribute('data-id');

            if (!openBoxes[nodeId]) {
                const btnRect = clickedButton.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();

                let leftPos = (btnRect.left - containerRect.left) + 15; 
                let topPos = (btnRect.top - containerRect.top) - 20;   

                const boxWidth = 250;
                const boxHeight = 180; 

                Object.values(openBoxes).forEach(existingBox => {
                    const exLeft = parseInt(existingBox.style.left);
                    const exTop = parseInt(existingBox.style.top);

                    if (Math.abs(leftPos - exLeft) < boxWidth && Math.abs(topPos - exTop) < boxHeight) {
                        topPos = exTop + boxHeight + 10; 
                    }
                });

                const infoBox = document.createElement('div');
                infoBox.className = 'info-box';
                infoBox.style.left = `${leftPos}px`;
                infoBox.style.top = `${topPos}px`;

                const titleText = clickedButton.getAttribute('data-title');
                const infoText = clickedButton.getAttribute('data-info');
                const imageSrc = clickedButton.getAttribute('data-image');

                let imgHtml = '';
                if (imageSrc && imageSrc.trim() !== '') {
                    imgHtml = `<img src="${imageSrc}" style="display: block;" alt="${titleText}">`;
                }

                infoBox.innerHTML = `
                    <button class="close-btn">&times;</button>
                    ${imgHtml}
                    <h2>${titleText}</h2>
                    <p>${infoText}</p>
                `;

                const closeBtn = infoBox.querySelector('.close-btn');
                closeBtn.addEventListener('click', (ev) => {
                    ev.stopPropagation();
                    infoBox.remove();
                    delete openBoxes[nodeId];
                });

                container.appendChild(infoBox);
                openBoxes[nodeId] = infoBox;
            }

            if (firstSelectedButton === clickedButton) {
                clickedButton.classList.remove('selected');
                firstSelectedButton = null;
                return;
            }

            if (!firstSelectedButton) {
                firstSelectedButton = clickedButton;
                clickedButton.classList.add('selected');
            } else {
                const secondSelectedButton = clickedButton;
                
                firstSelectedButton.classList.remove('selected');
                firstSelectedButton.classList.add('connected');
                secondSelectedButton.classList.add('connected');

                drawLine(firstSelectedButton, secondSelectedButton);

                firstSelectedButton = null;
            }
        });
    });

    function drawLine(btn1, btn2) {
        const rect1 = btn1.getBoundingClientRect();
        const rect2 = btn2.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();

        const x1 = rect1.left + rect1.width / 2 - containerRect.left;
        const y1 = rect1.top + rect1.height / 2 - containerRect.top;
        const x2 = rect2.left + rect2.width / 2 - containerRect.left;
        const y2 = rect2.top + rect2.height / 2 - containerRect.top;

        // 1. Create and append the line element
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        svg.appendChild(line);

        // 2. Fetch the distance from the dictionary based on node IDs
        const id1 = btn1.getAttribute('data-id');
        const id2 = btn2.getAttribute('data-id');
        
        // Sort IDs so "1-2" matches regardless of which node you clicked first
        const pairKey = [id1, id2].sort().join('-');
        const distanceText = predefinedDistances[pairKey] || ''; // Defaults to blank if not set

        // 3. If a distance is defined, calculate midpoint and display text label
        if (distanceText) {
            const midX = (x1 + x2) / 2;
            const midY = (y1 + y2) / 2;

            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', midX);
            text.setAttribute('y', midY - 8); // Shifted slightly above the line
            text.setAttribute('class', 'distance-label');
            text.textContent = distanceText;
            svg.appendChild(text);
        }
    }
</script>

</body>
</html>
